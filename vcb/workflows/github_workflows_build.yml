name: build
on: [push, workflow_dispatch]
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
      - run: cl /nologo /std:c++20 /O2 /EHsc /MT /DNDEBUG main.cpp /Fe:vcb.exe /link /SUBSYSTEM:WINDOWS user32.lib gdi32.lib gdiplus.lib winmm.lib
      - uses: actions/upload-artifact@v4
        with:
          name: vcb
          path: |
            vcb.exe
            config.ini